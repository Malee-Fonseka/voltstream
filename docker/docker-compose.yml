# voltstream — tiers 1 (infrastructure) and 2 (bootstrap) of the stack (§8.2, T043-T047).
#
# `name: voltstream` below is mandatory per D7: Compose otherwise derives the project
# name from the folder holding this file (`docker/`), and the repository folder is not
# spelled like the package (see D7). This key is what makes every network, volume and
# container come out `voltstream-*` regardless of where the repository is checked out.
#
# Tier 1 (kafka, postgres, minio) has real healthchecks, never a `sleep` (§8.2). Tier 2
# (the three `-init` services) apply schema/topics/buckets and exit 0; every statement
# they run is idempotent, because they run again on every `compose up`, not only once.

name: voltstream

# The object store image, defined once for the server and the bucket-creating init job.
#
# MinIO Inc. stopped publishing community images in October 2025, archived the repository
# in February 2026 and deleted its Docker Hub repositories in September 2026, so
# quay.io/minio/* and minio/* no longer pull on a clean machine (D8). pgsty/silo is a
# community-maintained fork (formerly pgsty/minio): same S3 API, same MINIO_* variables,
# same /minio/health/live endpoint, with `mc` in the same image. Pinned to a release tag,
# never `latest` — a single-maintainer fork must not change underneath a graded demo. Not
# the `-distroless` variant: the healthcheck needs curl, and minio-init needs a shell.
# Planned replacement: SeaweedFS (D8).
x-object-store-image: &object-store-image pgsty/silo:RELEASE.2026-09-16T00-00-00Z

services:
  # ============================================================================
  # Tier 1 — infrastructure
  # ============================================================================
  kafka:
    image: apache/kafka:3.8.0
    container_name: voltstream-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-Tsb-BTJJRQWukaYvUsVNIA}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Where kafka_data is mounted. The image's default is /tmp/kraft-combined-logs, inside
      # the container: topics then vanished on `make down && make up` while the Spark
      # checkpoints on their own volumes survived, pointing at offsets that no longer exist.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [voltstream]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: voltstream-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voltstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voltstream}
      POSTGRES_DB: ${POSTGRES_DB:-voltstream}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [voltstream]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voltstream} -d ${POSTGRES_DB:-voltstream}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # The service keeps the name `minio`: `minio:9000` is the S3 endpoint every client uses.
  minio:
    image: *object-store-image
    container_name: voltstream-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-voltstream}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-voltstream-dev}
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks: [voltstream]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # ============================================================================
  # Tier 2 — bootstrap (one-shot, idempotent, run again on every `compose up`)
  # ============================================================================
  postgres-init:
    image: postgres:16-alpine
    container_name: voltstream-postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-voltstream}
      PGPASSWORD: ${POSTGRES_PASSWORD:-voltstream}
      PGDATABASE: ${POSTGRES_DB:-voltstream}
      # The read-only role Grafana and sql_exporter log in as (04_observability.sql).
      READER_PASSWORD: ${POSTGRES_READER_PASSWORD:-voltstream-reader}
    volumes:
      - ./init/postgres:/sql:ro
    networks: [voltstream]
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        for f in /sql/*.sql; do
          echo "applying $$f"
          psql -v ON_ERROR_STOP=1 -v reader_password="$$READER_PASSWORD" -f "$$f"
        done

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: voltstream-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-meter.readings}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-meter.readings.dlq}
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-3}
      KAFKA_RETENTION_MS: ${KAFKA_RETENTION_MS:-604800000}
    volumes:
      - ./init/kafka:/scripts:ro
    networks: [voltstream]
    entrypoint: ["/bin/bash", "/scripts/create_topics.sh"]

  minio-init:
    # The server image carries `mc`, so the separate client image is no longer needed.
    image: *object-store-image
    container_name: voltstream-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-voltstream}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-voltstream-dev}
      MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW:-voltstream-raw}
      MINIO_BUCKET_LANDING: ${MINIO_BUCKET_LANDING:-voltstream-landing}
      MINIO_BUCKET_ARCHIVE: ${MINIO_BUCKET_ARCHIVE:-voltstream-archive}
    volumes:
      - ./init/minio:/scripts:ro
    networks: [voltstream]
    entrypoint: ["/bin/sh", "/scripts/create_buckets.sh"]

  # ============================================================================
  # Tier 3 — simulators (decision T076). Both on the `app` image (§7.3: no PySpark).
  # ============================================================================
  meter-producer:
    build:
      context: ..
      dockerfile: docker/images/app.Dockerfile
    image: voltstream-app:${VOLTSTREAM_IMAGE_TAG:-local}
    container_name: voltstream-meter-producer
    restart: unless-stopped
    command: ["voltstream-producer"]
    environment:
      VOLTSTREAM_ENV: docker
      VOLTSTREAM_CONFIG_DIR: /app/config
      # Shared simulated-clock anchor so every container maps the same real instant
      # to the same simulated one. Unset means each process anchors on its own
      # start, and they drift apart by their startup skew times time_scale.
      VOLTSTREAM__SIMULATION__ANCHOR_REAL: ${VOLTSTREAM_ANCHOR_REAL:-}
      VOLTSTREAM__KAFKA__BOOTSTRAP_SERVERS: kafka:9092
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-voltstream}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-voltstream-dev}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
    volumes:
      - ../config:/app/config:ro
    networks: [voltstream]
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  reference-dropper:
    build:
      context: ..
      dockerfile: docker/images/app.Dockerfile
    image: voltstream-app:${VOLTSTREAM_IMAGE_TAG:-local}
    container_name: voltstream-reference-dropper
    restart: unless-stopped
    command: ["voltstream-dropper"]
    environment:
      VOLTSTREAM_ENV: docker
      VOLTSTREAM_CONFIG_DIR: /app/config
      # Shared simulated-clock anchor so every container maps the same real instant
      # to the same simulated one. Unset means each process anchors on its own
      # start, and they drift apart by their startup skew times time_scale.
      VOLTSTREAM__SIMULATION__ANCHOR_REAL: ${VOLTSTREAM_ANCHOR_REAL:-}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-voltstream}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-voltstream-dev}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
    volumes:
      - ../config:/app/config:ro
    networks: [voltstream]
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Raw archiver (T082, §8.3) — Kafka to the master dataset, no transformation.
  # On the Spark image, not the app image: it needs the hadoop-aws and kafka connector
  # JARs baked into spark.Dockerfile.
  raw-archiver:
    build:
      context: ..
      dockerfile: docker/images/spark.Dockerfile
    image: voltstream-spark:${VOLTSTREAM_IMAGE_TAG:-local}
    container_name: voltstream-raw-archiver
    restart: unless-stopped
    command: ["voltstream-archiver"]
    environment:
      VOLTSTREAM_ENV: docker
      VOLTSTREAM_CONFIG_DIR: /app/config
      # Shared simulated-clock anchor so every container maps the same real instant
      # to the same simulated one. Unset means each process anchors on its own
      # start, and they drift apart by their startup skew times time_scale.
      VOLTSTREAM__SIMULATION__ANCHOR_REAL: ${VOLTSTREAM_ANCHOR_REAL:-}
      VOLTSTREAM__KAFKA__BOOTSTRAP_SERVERS: kafka:9092
      # T044: the checkpoint lives on the named volume mounted below, never in /tmp.
      VOLTSTREAM_CHECKPOINT_DIR: /var/lib/voltstream/checkpoints
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-voltstream}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-voltstream-dev}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-1g}
    ports:
      # Driver metrics (T081). Mapped so Prometheus (Phase 12) and a developer can
      # both reach it; the port itself comes from observability.metrics_port.
      - "${ARCHIVER_METRICS_PORT:-8011}:8001"
    volumes:
      - ../config:/app/config:ro
      - archiver_checkpoints:/var/lib/voltstream/checkpoints
    networks: [voltstream]
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  # Speed layer (T095, §8.4). Its own consumer group and its own checkpoint volume:
  # independent consumer groups are what let the two Lambda branches read one topic
  # without either noticing the other (§5.2).
  speed-layer:
    build:
      context: ..
      dockerfile: docker/images/spark.Dockerfile
    image: voltstream-spark:${VOLTSTREAM_IMAGE_TAG:-local}
    container_name: voltstream-speed-layer
    restart: unless-stopped
    command: ["voltstream-speed-layer"]
    environment:
      VOLTSTREAM_ENV: docker
      VOLTSTREAM_CONFIG_DIR: /app/config
      VOLTSTREAM__SIMULATION__ANCHOR_REAL: ${VOLTSTREAM_ANCHOR_REAL:-}
      VOLTSTREAM__KAFKA__BOOTSTRAP_SERVERS: kafka:9092
      VOLTSTREAM__POSTGRES__HOST: postgres
      VOLTSTREAM__POSTGRES__PASSWORD: ${POSTGRES_PASSWORD:-voltstream}
      VOLTSTREAM_CHECKPOINT_DIR: /var/lib/voltstream/checkpoints
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-voltstream}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-voltstream-dev}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-1g}
    ports:
      - "${SPEED_LAYER_METRICS_PORT:-8012}:8001"
    volumes:
      - ../config:/app/config:ro
      - speed_checkpoints:/var/lib/voltstream/checkpoints
    networks: [voltstream]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  # Serving API (T108, §5.8). On the app image — no PySpark, so it stays small and starts
  # in seconds, which is what lets the healthcheck below be meaningful.
  api:
    build:
      context: ..
      dockerfile: docker/images/app.Dockerfile
    image: voltstream-app:${VOLTSTREAM_IMAGE_TAG:-local}
    container_name: voltstream-api
    restart: unless-stopped
    command: ["voltstream-api"]
    environment:
      VOLTSTREAM_ENV: docker
      VOLTSTREAM_CONFIG_DIR: /app/config
      VOLTSTREAM__SIMULATION__ANCHOR_REAL: ${VOLTSTREAM_ANCHOR_REAL:-}
      VOLTSTREAM__POSTGRES__HOST: postgres
      VOLTSTREAM__POSTGRES__PASSWORD: ${POSTGRES_PASSWORD:-voltstream}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-voltstream}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-voltstream-dev}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - ../config:/app/config:ro
    networks: [voltstream]
    healthcheck:
      # /health/ready, not /health/live: the container is only useful once Postgres and
      # MinIO are reachable, and readiness is what reports that (T105).
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully

  # ============================================================================
  # Tier 4 — orchestration (T120, D6)
  # ============================================================================
  # The Docker socket is mounted into the proxy and NOWHERE else. Handing
  # /var/run/docker.sock to Airflow would give any DAG — or anything that can write a DAG
  # file — full control of the host daemon, which is root-equivalent. The proxy exposes
  # only the four capabilities DockerOperator needs and refuses the rest, so the blast
  # radius of a compromised DAG is "can run containers", not "owns the machine".
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.1.1
    container_name: voltstream-docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      POST: 1
      # Everything else stays off. EXEC and VOLUMES in particular are container-escape
      # primitives, and nothing here needs them.
      EXEC: 0
      VOLUMES: 0
      INFO: 0
      SERVICES: 0
      TASKS: 0
      SECRETS: 0
      SWARM: 0
      SYSTEM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [voltstream]

  airflow:
    build:
      context: ..
      dockerfile: docker/images/airflow.Dockerfile
    image: voltstream-airflow:${VOLTSTREAM_IMAGE_TAG:-local}
    container_name: voltstream-airflow
    restart: unless-stopped
    # One container, LocalExecutor (D6). A full scheduler/webserver/worker/triggerer split
    # buys nothing at one DAG run per simulated day and costs four containers of memory on
    # a laptop that is already running Kafka, Spark and Postgres.
    command: ["standalone"]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER:-voltstream}:${POSTGRES_PASSWORD:-voltstream}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
      # Connections as environment variables, so a fresh clone needs no UI clicking and
      # the configuration is in version control rather than in someone's browser session.
      AIRFLOW_CONN_MINIO_S3: >-
        aws://${MINIO_ROOT_USER:-voltstream}:${MINIO_ROOT_PASSWORD:-voltstream-dev}@/?endpoint_url=http%3A%2F%2Fminio%3A9000&region_name=us-east-1
      AIRFLOW_CONN_VOLTSTREAM_PG: >-
        postgresql://${POSTGRES_USER:-voltstream}:${POSTGRES_PASSWORD:-voltstream}@postgres:5432/${POSTGRES_DB:-voltstream}
      # The images the DAG launches: Spark for billing and the rollup, the app image for
      # reconciliation (D6).
      VOLTSTREAM_SPARK_IMAGE: voltstream-spark:${VOLTSTREAM_IMAGE_TAG:-local}
      VOLTSTREAM_APP_IMAGE: voltstream-app:${VOLTSTREAM_IMAGE_TAG:-local}
      VOLTSTREAM_NETWORK: voltstream
      VOLTSTREAM_ANCHOR_REAL: ${VOLTSTREAM_ANCHOR_REAL:-}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      # The DAG hands these to the containers it launches (R36). Without them it fell back
      # to the defaults, and a non-default password in .env failed every batch task.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voltstream}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-voltstream}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-voltstream-dev}
    ports:
      - "${AIRFLOW_HOST_PORT:-8080}:8080"
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/plugins:/opt/airflow/plugins
      # The DAGs' three tunables come from here via yaml.safe_load — configuration, not a
      # code dependency on the voltstream package (which this image deliberately lacks).
      - ../config:/opt/airflow/voltstream-config:ro
    networks: [voltstream]
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      docker-socket-proxy:
        condition: service_started

  # ============================================================================
  # Tier 4 — observability (T142-T155, §5.7, §10.1)
  # ============================================================================
  # Images pinned to release tags, never `latest`, for the same reason as the object store:
  # a graded demo must not change underneath itself.

  # Short-lived batch containers exit before a scrape could reach them, so they push here
  # as they finish (T116, R07). The DAG passes the URL to them; Prometheus scrapes it.
  pushgateway:
    image: prom/pushgateway:v1.11.3
    container_name: voltstream-pushgateway
    restart: unless-stopped
    ports:
      - "${PUSHGATEWAY_HOST_PORT:-9091}:9091"
    networks: [voltstream]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9091/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Gauges computed from Postgres for MeterDataStale and BatchSLAMiss (T147, D9). Logs in
  # as the read-only role; the DSN is built here so the password comes from .env.
  sql-exporter:
    image: burningalchemist/sql_exporter:0.24.8
    container_name: voltstream-sql-exporter
    restart: unless-stopped
    command:
      - -config.file=/etc/sql_exporter/sql_exporter.yml
      - -config.data-source-name=postgres://voltstream_reader:${POSTGRES_READER_PASSWORD:-voltstream-reader}@postgres:5432/${POSTGRES_DB:-voltstream}?sslmode=disable
    volumes:
      - ../config/sql_exporter:/etc/sql_exporter:ro
    networks: [voltstream]
    depends_on:
      postgres:
        condition: service_healthy
      # The role it logs in as is created there (04_observability.sql).
      postgres-init:
        condition: service_completed_successfully

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: voltstream-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "${ALERTMANAGER_HOST_PORT:-9093}:9093"
    volumes:
      - ../config/alertmanager:/etc/alertmanager:ro
      # Silences and notification state, so a restart does not re-send every alert.
      - alertmanager_data:/alertmanager
    networks: [voltstream]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: voltstream-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # POST /-/reload re-reads the config and rules after an edit, without a restart.
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ../config/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    networks: [voltstream]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      alertmanager:
        condition: service_started

  # Anonymous viewers, so the demo needs no login (T155); the admin login still exists for
  # anyone who needs to explore. Datasources and dashboards are provisioned from the
  # repository (T151): a cold start has all of them, with no clicking.
  grafana:
    image: grafana/grafana:13.2.2
    container_name: voltstream-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/pipeline-health.json
      # Offline-friendly: no phoning home from a demo laptop.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Interpolated into the Postgres datasource (provisioning/datasources.yml).
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD:-voltstream-reader}
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      # The task's two provisioning files, each mounted where Grafana looks for its kind.
      - ../config/grafana/provisioning/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../config/grafana/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../config/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [voltstream]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_started
      postgres-init:
        condition: service_completed_successfully

networks:
  voltstream:
    name: voltstream

volumes:
  # Tier 1 data — survive `make down`, destroyed only by `make clean`.
  postgres_data:
  kafka_data:
  minio_data:
  # Spark checkpoints (§8.5, T044): named volumes, never a bind mount into /tmp — a
  # checkpoint directory must survive a container restart with stable inode identity.
  # Declared now, before the streaming jobs exist, so nobody bind-mounts them later out
  # of convenience.
  speed_checkpoints:
  archiver_checkpoints:
  # Tier 4 — observability state. Also survive `make down`; `make clean` resets them with
  # the rest, so a fresh run starts with empty history.
  prometheus_data:
  alertmanager_data:
  grafana_data:
