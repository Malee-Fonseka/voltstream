# voltstream — Prometheus (T142, §10.1). Pull model (§5.7): every service below exposes
# /metrics and Prometheus scrapes it; nothing in the pipeline knows Prometheus exists.

global:
  # Sized against the tightest alert. MeterDataStale fires on 2 real minutes of silence
  # (alerts.stale_data_minutes); at 15 s that is eight samples, so one slow or missed
  # scrape cannot decide the alert either way. A 1-minute scrape would give two, and the
  # alert would fire anywhere between 2 and 3 minutes depending on scrape phase.
  #
  # It cannot see individual 15-simulated-minute windows anyway. A window is 3.1 real
  # seconds at TIME_SCALE 288 and the speed layer publishes once per 10-second trigger,
  # so faster scraping would only resample the same values (see alert_rules.yml,
  # LowRenewableContribution).
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The four long-running voltstream processes. Each serves the one shared registry from
  # voltstream.metrics: the API on its own port, the rest on observability.metrics_port.
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  - job_name: meter-producer
    static_configs:
      - targets: ["meter-producer:8001"]

  # The Spark jobs publish from the driver, inside foreachBatch; executors are not
  # scraped (§5.7's stated limitation).
  - job_name: speed-layer
    static_configs:
      - targets: ["speed-layer:8001"]

  - job_name: raw-archiver
    static_configs:
      - targets: ["raw-archiver:8001"]

  # One-shot batch containers push here when they finish (T116, R07): billing and the
  # zone rollup push voltstream_batch_duration_seconds, reconciliation pushes
  # voltstream_lambda_divergence. honor_labels keeps the job label each run pushed
  # (daily_billing, daily_zone_rollup, reconciliation) instead of overwriting it with
  # "pushgateway".
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  # The Postgres-derived gauges MeterDataStale and BatchSLAMiss read (D9).
  - job_name: sql-exporter
    static_configs:
      - targets: ["sql-exporter:9399"]

  # The monitoring stack watching itself: a rule that cannot be evaluated, or an alert
  # that cannot be delivered, shows up here before it shows up as silence.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
